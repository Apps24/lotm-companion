name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'phase/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate canonical Book 1 data
        run: npm run validate:data
      - name: Release QA smoke checks
        run: npm run qa:release
      - name: Build static site
        run: npm run build
      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/chapters/2/index.html
          test -f out/tarot/index.html
          test -f out/world/index.html
          test -f out/timeline/index.html
          test -f out/visuals/index.html
